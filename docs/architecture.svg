<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="prod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d1"/>
    </linearGradient>
    <linearGradient id="demo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="op" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="880" height="360" rx="16" fill="#0b1020"/>
  <text x="32" y="38" fill="#e2e8f0" font-size="18" font-weight="700">Social Skills — memory architecture</text>
  <text x="32" y="58" fill="#94a3b8" font-size="12">One caption → ten networks · memory is the differentiator</text>

  <!-- Public trust surface -->
  <rect x="32" y="84" width="392" height="232" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="52" y="112" fill="#e2e8f0" font-size="13" font-weight="700">PUBLIC TRUST SURFACE</text>
  <text x="52" y="130" fill="#64748b" font-size="10">unauthenticated · /journey</text>

  <rect x="52" y="146" width="352" height="40" rx="8" fill="url(#prod)" opacity="0.16" stroke="url(#prod)"/>
  <text x="68" y="171" fill="#c4b5fd" font-size="12">getJourneyMemory() · product</text>
  <rect x="52" y="194" width="352" height="40" rx="8" fill="url(#demo)" opacity="0.16" stroke="url(#demo)"/>
  <text x="68" y="219" fill="#6ee7b7" font-size="12">getJourneyMemory() · user_demo (seeded)</text>

  <rect x="52" y="246" width="352" height="40" rx="8" fill="#0f172a" stroke="#22d3ee"/>
  <text x="68" y="271" fill="#7dd3fc" font-size="12">applyHygiene() — COS v3: forgetting curve</text>

  <text x="52" y="306" fill="#e2e8f0" font-size="11">→ renders /journey (prospect view)</text>

  <!-- Operator only -->
  <rect x="456" y="84" width="392" height="232" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="476" y="112" fill="#e2e8f0" font-size="13" font-weight="700">OPERATOR ONLY</text>
  <text x="476" y="130" fill="#64748b" font-size="10">auth-gated · /api/journey/operator</text>

  <rect x="476" y="146" width="352" height="40" rx="8" fill="url(#op)" opacity="0.16" stroke="url(#op)"/>
  <text x="492" y="171" fill="#fcd34d" font-size="12">gbrain operator memory</text>

  <rect x="476" y="194" width="352" height="40" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="492" y="219" fill="#fca5a5" font-size="12">401 when unauthenticated</text>

  <text x="476" y="306" fill="#64748b" font-size="11">never reaches the public page</text>

  <!-- divider + verdict -->
  <line x1="440" y1="84" x2="440" y2="316" stroke="#1f2937" stroke-dasharray="4 4"/>
  <rect x="32" y="328" width="816" height="20" rx="6" fill="#0f172a"/>
  <text x="440" y="342" fill="#94a3b8" font-size="11" text-anchor="middle">Postiz = scheduling UI · Post-Bridge = agent pipe · Social Skills = memory you can SEE</text>
</svg>
